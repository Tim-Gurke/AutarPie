name: Gespeicherte Modelle in der Oberfläche prüfen
on:
  push:
    branches: ['prepare/3.1.4-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Neustart, Wetterwechsel und Hintergrundmodelle prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
          WATTPIT_SCREENSHOT_DIR: app/build/reports/model-review
          WATTPIT_SUPPLIES_SCREENSHOTS: app/build/reports/model-review/supplies
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/model-ui" playwright@1.51.1 pngjs@7.0.0
          export NODE_PATH="$RUNNER_TEMP/model-ui/node_modules"
          failed=0
          for check in learned-model supplies solar-planning release-304 learning-recovery release-311; do
            node "tools/${check}-smoke.cjs" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutarPie-3.1.4-Modellpruefung
          path: app/build/reports/model-review/
